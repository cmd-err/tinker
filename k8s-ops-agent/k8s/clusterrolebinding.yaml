apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ops-agent-binding
  labels:
    app: k8s-ops-agent
subjects:
  - kind: ServiceAccount
    name: k8s-ops-agent-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-ops-agent-role
  apiGroup: rbac.authorization.k8s.io
